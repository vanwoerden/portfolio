<!DOCTYPE html>
<html lang="en">
<head>
    <title>Being flexible about time and scope - The Works of Ernst</title>
    <script src="/on/principles/principles-boot.js"></script>
    <link rel="stylesheet" type="text/css" href="/css/fonts.css">
    <link rel="stylesheet" type="text/css" href="/css/style-million.css">
    <link rel="stylesheet" type="text/css" href="/on/project-breadcrumb.css">
    <link rel="stylesheet" type="text/css" href="/on/principles/shared.css">
    <script src="/on/principles/principles-nav.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <script>
        function fixedTime(){
            console.log("fixedTime");
            var timeToggle = document.getElementById("time");
            var scopeToggle = document.getElementById("scope");

            scopeToggle.checked = false;
        }

        function fixedScope(){
            console.log("fixedScope");
            var timeToggle = document.getElementById("time");
            var scopeToggle = document.getElementById("scope");

            timeToggle.checked = false;
        }
    </script>
</head>
<body class="principle-site">
    <div class="close-button-container">
        <span class="close-button-label">Esc</span>
        <a href="/" class="close-button" aria-label="Close" onclick="sessionStorage.setItem('nav-direction', 'backward');">×</a>
    </div>
    <div class="principle-site__page">
        <header class="principle-site__header">
            <nav class="dd-breadcrumb" aria-label="Breadcrumb">
                <a href="/" onclick="sessionStorage.setItem('nav-direction','backward')">ernst.works</a>
                <span class="dd-breadcrumb__sep" aria-hidden="true">/</span>
                <a href="/on/">on</a>
                <span class="dd-breadcrumb__sep" aria-hidden="true">/</span>
                <span class="dd-breadcrumb__current" aria-current="page">Time vs scope</span>
            </nav>
        </header>
        <div class="principle-page">
            <h1 class="principle principle-title">
            <span class="nermal">Being </span><span class="attention">flexible about time and scope.</span> <span class="nermal"></span>
        </h1>
        <div class="principle-content">
            <div>
                <h1>
                    <form>
                        <fieldset class="toggles">
                            <div>
                            <input type="checkbox" name="time" id="time" checked onclick="fixedTime()">
                            <label for="time">Deliver the project on time. </label>
                            </div>
                            <div>
                            <input type="checkbox" name="scope" id="scope" onclick="fixedScope()">
                            <label for="scope">Deliver 100% of the scope.</label>
                            </div>
                        </fieldset>
                    </form>
                </h1>
            </div>
        </div>
    </div>
    </div>
    <div class="nav-buttons">
        <a href="/on/principles/starting-out-informed/" class="nav-button">➠</a>
        <a href="/on/principles/quality/" class="nav-button">➠</a>
    </div>
</body>
