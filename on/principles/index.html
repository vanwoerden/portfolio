    <style>
        body.principle-site {
            --principle-main-width: min(92rem, 100%);
            --principle-nav-side-reserve: 0px;
            --principle-pad-x: 4vw;
        }

        .principle-site__page {
            max-width: var(--principle-main-width);
            padding-right: 0;
        }

        .principles-index {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 1.35rem;
        }

        .principles-index__link {
            display: block;
            font-family: "Henrietta Regular", serif;
            font-size: 3.2rem;
            line-height: 1.2;
            color: var(--very-light-yellow);
            text-decoration: none;
            text-wrap: nowrap;
            white-space: nowrap;
        }

        body.principle-site a.principles-index__link,
        body.principle-site a.principles-index__link:hover,
        body.principle-site a.principles-index__link:visited,
        body.principle-site a.principles-index__link:focus,
        body.principle-site a.principles-index__link:focus-visible {
            color: var(--very-light-yellow);
            text-decoration: none;
            background: none;
        }

        body.principle-site a.principles-index__link .nermal {
            color: var(--very-light-yellow);
        }

        body.principle-site a.principles-index__link .attention {
            color: rgb(79, 246, 140);
        }
    </style>
</head>
<body class="principle-site">
    <div class="dd-close-group">
        <a class="dd-key" href="/on/" aria-label="Close" onclick="sessionStorage.setItem('nav-direction','backward')">Esc</a>
    </div>
    <div class="principle-site__page">
        <header class="principle-site__header">
            <nav class="dd-breadcrumb" aria-label="Breadcrumb">
                <a href="/" onclick="sessionStorage.setItem('nav-direction','backward')">ernst.works</a>
                <span class="dd-breadcrumb__sep" aria-hidden="true">/</span>
                <a href="/on/" onclick="sessionStorage.setItem('nav-direction','backward')">on</a>
                <span class="dd-breadcrumb__sep" aria-hidden="true">/</span>
                <span class="dd-breadcrumb__current" aria-current="page">principles</span>
            </nav>
        </header>
        <div class="principle-page">
            <ul class="principles-index" id="principles-index"></ul>
        </div>
    </div>
    <script>
        (function () {
            var list = document.getElementById('principles-index');
            if (!list) return;

            // List content comes only from principles-data.js → window.PRINCIPLES
            if (!window.PRINCIPLES || !window.PRINCIPLES.length) {
                console.error('principles-data.js did not load window.PRINCIPLES');
                return;
            }

            var principles = window.PrinciplesDrafts
                ? window.PrinciplesDrafts.visiblePrinciples()
                : window.PRINCIPLES.filter(function (p) { return p.published; });

            principles.forEach(function (principle) {
                var item = document.createElement('li');
                var link = document.createElement('a');
                link.className = 'principles-index__link';
                link.href = '/on/principles/' + principle.slug + '/';
                link.innerHTML = principle.titleHtml || principle.title;
                link.setAttribute('aria-label', principle.title);
                link.onclick = function () {
                    sessionStorage.setItem('nav-direction', 'down');
                };
                item.appendChild(link);
                list.appendChild(item);
            });
        })();
    </script>
</body>
</html>
