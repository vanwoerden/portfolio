<!DOCTYPE html>
<html>
<head>
    <title>Keeping quality constant - The Works of Ernst</title>
    <link rel="stylesheet" type="text/css" href="../../css/fonts.css">
    <link rel="stylesheet" type="text/css" href="../../css/style-million.css">
    <link rel="stylesheet" type="text/css" href="../shared.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <style>
        html {
            background-color: var(--bg-quality);
        }
    </style>
    <script>
        // Handle Escape key to go back to index.html
        // Handle Arrow keys to navigate between principles
        window.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' || event.keyCode === 27) {
                event.preventDefault();
                sessionStorage.setItem('nav-direction', 'backward');
                window.location.href = '../../index.html';
            } else if (event.key === 'ArrowLeft' || event.keyCode === 37) {
                event.preventDefault();
                sessionStorage.setItem('nav-direction', 'backward');
                window.location.href = '../time-vs-scope/index.html';
            } else if (event.key === 'ArrowRight' || event.keyCode === 39) {
                event.preventDefault();
                sessionStorage.setItem('nav-direction', 'forward');
                window.location.href = '../before-and-after/index.html';
            }
        });
    </script>
</head>
<body>
    <div class="close-button-container">
        <a href="../../index.html" class="close-button" aria-label="Close" onclick="sessionStorage.setItem('nav-direction', 'backward');">×</a>
        <span class="close-button-label">ESC</span>
    </div>
    <div class="principle-page">
        <h1 class="principle principle-title">
            <span class="nermal">Keeping </span><span class="attention">quality</span><span class="nermal"> constant.</span>
        </h1>
        <div class="principle-content">
            <p class="money-quote">
                Quality is non-negotiable. Quality is non-negotiable. Quality is non-negotiable. Quality is non-negotiable. Quality is non-negotiable.
            </p>
        </div>
        <div class="nav-buttons">
            <a href="../time-vs-scope/index.html" class="nav-button">←</a>
            <a href="../before-and-after/index.html" class="nav-button">→</a>
        </div>
    </div>
</body>
</html>
