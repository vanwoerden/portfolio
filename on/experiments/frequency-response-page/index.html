    <meta charset="UTF-8">

    <title>Audio frequency response graph in D3.js - ernst.works</title>
    <link rel="stylesheet" type="text/css" href="../../css/fonts.css">
    <link rel="stylesheet" type="text/css" href="/on/project-breadcrumb.css">
    <script>
        (function() {
            var d = sessionStorage.getItem('nav-direction');
            document.documentElement.style.setProperty('--vt-new-animation',
                d === 'backward' ? 'push-in-from-top' : 'push-in-from-bottom');
            document.documentElement.style.setProperty('--vt-old-animation',
                d === 'backward' ? 'push-out-to-bottom' : 'push-out-to-top');
            sessionStorage.removeItem('nav-direction');
        })();

        window.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                sessionStorage.setItem('nav-direction', 'backward');
                window.location.href = '/on/experiments/index.html';
            }
        });
    </script>
    <style>
        @view-transition {
            navigation: auto;
            types: forward, backward;
        }

        @keyframes push-in-from-bottom {
            from { transform: translateY(100%); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
        @keyframes push-in-from-top {
            from { transform: translateY(-100%); opacity: 0; }
            to   { transform: translateY(0);     opacity: 1; }
        }
        @keyframes push-out-to-top {
            from { transform: translateY(0);    opacity: 1; }
            to   { transform: translateY(-100%); opacity: 0; }
        }
        @keyframes push-out-to-bottom {
            from { transform: translateY(0);   opacity: 1; }
            to   { transform: translateY(100%); opacity: 0; }
        }

        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation-duration: 0.5s;
            animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1);
        }
        ::view-transition-new(root) { animation-name: var(--vt-new-animation, push-in-from-bottom); }
        ::view-transition-old(root) { animation-name: var(--vt-old-animation, push-out-to-top); }

        ::view-transition-old(close-button),
        ::view-transition-new(close-button) { animation: none; }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            background: #1a1a1a;
            overflow: hidden;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-button-container {
            position: fixed;
            top: 1.25rem;
            right: 1.5rem;
            z-index: 10000;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 0.5rem;
            pointer-events: none;
            view-transition-name: close-button;
        }

        .close-button-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-family: "Henrietta Regular", sans-serif;
            pointer-events: none;
        }

        .close-button {
            width: 1.5rem;
            height: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 1.5rem;
            line-height: 1;
            transition: all 0.2s ease;
            cursor: pointer;
            pointer-events: auto;
        }

        .close-button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 1);
            transform: scale(1.1);
        }

        .close-button:active { transform: scale(0.95); }

        .on-breadcrumb-container {
            position: fixed;
            top: 1.25rem;
            left: 1.5rem;
            z-index: 10001;
            max-width: calc(100vw - 8rem);
        }

        @media (max-width: 480px) {
            .close-button-container { top: 1rem; right: 1rem; }
            .close-button { min-width: 44px; min-height: 44px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="on-breadcrumb-container">
        <nav class="dd-breadcrumb" aria-label="Breadcrumb">
            <a href="/" onclick="sessionStorage.setItem('nav-direction','backward')">ernst.works</a>
            <span class="dd-breadcrumb__sep" aria-hidden="true">/</span>
            <a href="/on/">on</a>
            <span class="dd-breadcrumb__sep" aria-hidden="true">/</span>
            <span class="dd-breadcrumb__current" aria-current="page">Frequency response</span>
        </nav>
    </div>
    <div class="close-button-container">
        <span class="close-button-label">ESC</span>
        <a href="/on/experiments/index.html"
           class="close-button"
           onclick="sessionStorage.setItem('nav-direction','backward')">×</a>
    </div>
    <iframe src="/on/experiments/frequency-response/index.html" title="Audio frequency response graph"></iframe>
</body>
</html>
