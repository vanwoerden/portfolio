<!DOCTYPE html>
<html>
<head>
    <title>A great team craves slack, variety, and cadence - The Works of Ernst</title>
    <link rel="stylesheet" type="text/css" href="../../css/fonts.css">
    <link rel="stylesheet" type="text/css" href="../../css/style-million.css">
    <link rel="stylesheet" type="text/css" href="../shared.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <style>
        html {
            background-color: var(--bg-slack-variety-cadence);
        }
    </style>
    <script>
        // Handle Escape key to go back to index.html
        // Handle Arrow keys to navigate between principles
        window.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' || event.keyCode === 27) {
                event.preventDefault();
                sessionStorage.setItem('nav-direction', 'backward');
                window.location.href = '../../index.html';
            } else if (event.key === 'ArrowLeft' || event.keyCode === 37) {
                event.preventDefault();
                sessionStorage.setItem('nav-direction', 'backward');
                window.location.href = '../focus/index.html';
            } else if (event.key === 'ArrowRight' || event.keyCode === 39) {
                event.preventDefault();
                sessionStorage.setItem('nav-direction', 'forward');
                window.location.href = '../seeing-it-through-together/index.html';
            }
        });
    </script>
</head>
<body>
    <div class="close-button-container">
        <span class="close-button-label">ESC</span>
        <a href="../../index.html" class="close-button" aria-label="Close" onclick="sessionStorage.setItem('nav-direction', 'backward');">×</a>
    </div>
    <div class="principle-page">
        <h1 class="principle principle-title">
            <span class="nermal">A great team craves </span><span class="attention">slack, variety,</span> <span class="nermal"> and </span><span class="attention">cadence.</span>
        </h1>
        <div class="principle-content">
            <!-- This principle has no additional content beyond the title -->
        </div>
    </div>
    <div class="nav-buttons">
        <a href="../focus/index.html" class="nav-button">➠</a>
        <a href="../seeing-it-through-together/index.html" class="nav-button">➠</a>
    </div>
</body>
</html>
