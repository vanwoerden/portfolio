    <style>
        /* Match designers-should-code switch pixel size; body labels left-aligned */
        .tvs-toggles {
            /* Title toggle is 0.6/1.3/0.65/0.7em at ~51.2px → these rem values */
            --tvs-switch-width: 4.16rem;
            --tvs-switch-height: 1.92rem;
            --tvs-thumb: 2.08rem;
            --tvs-movement: 2.24rem;
            --tvs-track-border: 0.25rem;
            --tvs-thumb-border: 0.1875rem;
            margin: 0;
            padding: 0;
            border: none;
            max-width: none;
        }

        .principle-content:has(.tvs-toggles) {
            margin-top: 3.25rem;
        }

        form.useless:has(.tvs-toggles) {
            padding: 0;
            max-width: none;
            display: block;
        }

        fieldset.tvs-toggles.toggles.useless {
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
            margin: 0;
            padding: 0;
            border: none;
            border-radius: 0;
            overflow: visible;
        }

        fieldset.tvs-toggles.toggles.useless > div {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            margin: 0;
            padding: 0;
        }

        fieldset.tvs-toggles.toggles.useless > div:first-of-type {
            margin-top: 0;
        }

        fieldset.tvs-toggles.toggles.useless > div:last-of-type {
            margin-bottom: 0;
        }

        fieldset.tvs-toggles.toggles.useless [type="checkbox"] + label {
            display: inline-flex;
            align-items: center;
            width: auto;
            max-width: none;
            box-sizing: border-box;
            min-height: var(--tvs-thumb);
            height: var(--tvs-thumb);
            margin: 0;
            padding: 0 0 0 calc(var(--tvs-switch-width) + 1.35rem);
            font-size: 1.75rem;
            font-weight: 400;
            line-height: 1;
            color: var(--very-light-yellow-darker);
            white-space: nowrap;
            cursor: pointer;
        }

        fieldset.tvs-toggles.toggles.useless [type="checkbox"]:hover + label,
        fieldset.tvs-toggles.toggles.useless [type="checkbox"]:focus + label,
        fieldset.tvs-toggles.toggles.useless [type="checkbox"]:checked + label {
            color: var(--very-light-yellow-darker);
        }

        fieldset.tvs-toggles.toggles.useless [type="checkbox"]:hover + label::before,
        fieldset.tvs-toggles.toggles.useless [type="checkbox"]:focus + label::before {
            box-shadow: none;
        }

        fieldset.tvs-toggles.toggles.useless [type="checkbox"]:hover + label::after,
        fieldset.tvs-toggles.toggles.useless [type="checkbox"]:focus + label::after {
            background-image: none;
        }

        fieldset.tvs-toggles.toggles.useless [type="checkbox"] + label::before,
        fieldset.tvs-toggles.toggles.useless [type="checkbox"] + label::after {
            left: 0;
            right: auto;
            /* Sit slightly above geometric mid so label text reads centered */
            top: calc(50% - 0.12em);
            margin-top: 0;
            transform: translateY(-50%);
            transition: left 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
        }

        fieldset.tvs-toggles.toggles.useless [type="checkbox"] + label::before {
            width: var(--tvs-switch-width);
            height: var(--tvs-switch-height);
            border-width: var(--tvs-track-border);
            border-radius: calc(var(--tvs-switch-height) * 0.8);
        }

        fieldset.tvs-toggles.toggles.useless [type="checkbox"] + label::after {
            width: var(--tvs-thumb);
            height: var(--tvs-thumb);
            border-width: var(--tvs-thumb-border);
            left: 0;
        }

        fieldset.tvs-toggles.toggles.useless [type="checkbox"]:checked + label::after {
            left: var(--tvs-movement);
            right: auto;
        }
    </style>
    <script>
        function fixedTime() {
            document.getElementById("scope").checked = false;
